name: Build ClipBridge

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

jobs:
  windows:
    name: Build Windows exe
    runs-on: windows-latest

    defaults:
      run:
        working-directory: apps/windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build release executable
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: clipbridge-windows-exe
          path: apps/windows/src-tauri/target/release/clipbridge.exe
          if-no-files-found: error

  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: clipbridge-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
